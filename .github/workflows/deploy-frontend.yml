name: Deploy Selorg Dashboard Frontend (Static via Nginx)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e

            echo "=============================="
            echo "✅ FRONTEND STATIC DEPLOY STARTED"
            echo "=============================="

            FRONTEND_DIR="/home/ubuntu/selorg/selorg-dashboard-frontend-v1.1"
            WEB_DIR="/var/www/dashboard"
            BACKUP_DIR="/var/www/dashboard_backup"
            ENV_FILE="/home/ubuntu/envs/selorg-dashboard.env"

            cd $FRONTEND_DIR

            echo "🧹 Clean repo & pull latest code"
            git reset --hard
            git clean -fd
            git pull origin main

            echo "🔐 Inject env for Vite build"
            cp $ENV_FILE .env

            echo "🐳 Build React app using Docker (no runtime container)"
            docker run --rm \
              -v $FRONTEND_DIR:/app \
              -w /app \
              node:20-alpine sh -c "
                npm install &&
                npm run build
              "

            echo "💾 Backup current deployed site"
            rm -rf $BACKUP_DIR/*
            cp -r $WEB_DIR/* $BACKUP_DIR/ 2>/dev/null || true

            echo "🧹 Remove old site files"
            rm -rf $WEB_DIR/*

            echo "📂 Deploy new build"
            cp -r $FRONTEND_DIR/build/* $WEB_DIR/

            echo "🔄 Reload nginx"
            sudo systemctl reload nginx

            echo "🔍 Health check"
            if curl -f http://127.0.0.1 >/dev/null 2>&1; then
              echo "✅ Frontend deployed successfully!"
            else
              echo "❌ Deployment failed → Rolling back"
              rm -rf $WEB_DIR/*
              cp -r $BACKUP_DIR/* $WEB_DIR/
              sudo systemctl reload nginx
              exit 1
            fi

            echo "=============================="
            echo "✅ FRONTEND DEPLOYMENT FINISHED"
            echo "=============================="
