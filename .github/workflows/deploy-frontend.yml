name: Deploy Selorg Dashboard Frontend (Rollback Safe)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e

            echo "=============================="
            echo "✅ FRONTEND DEPLOYMENT STARTED"
            echo "=============================="

            FRONTEND_DIR="/home/ubuntu/selorg/selorg-dashboard-frontend-v1.1"
            LOCAL_DOCKERFILE="/home/ubuntu/dockerfiles/Dockerfile.frontend"
            NGINX_CONFIG="/home/ubuntu/dockerfiles/nginx-frontend.conf"
            IMAGE_NAME="selorg-dashboard-frontend"
            CONTAINER_NAME="selorg-frontend"
            PORT_MAPPING="8080:80"
            ENV_FILE="/home/ubuntu/envs/selorg-dashboard.env"

            cd $FRONTEND_DIR

            echo "🧹 Clean repo & pull latest code"
            git reset --hard
            git clean -fd
            git pull origin main

            echo "📄 Copy nginx config into build context"
            cp $NGINX_CONFIG nginx-frontend.conf

            echo "🔑 Reading Vite env variable"
            API_URL=$(grep VITE_API_BASE_URL $ENV_FILE | cut -d '=' -f2)
            echo "Using API: $API_URL"

            COMMIT=$(git rev-parse --short HEAD)
            NEW_IMAGE="${IMAGE_NAME}:${COMMIT}"
            LATEST_IMAGE="${IMAGE_NAME}:latest"
            BACKUP_IMAGE="${IMAGE_NAME}:backup"

            echo "📌 Backup current latest image"
            sudo docker image inspect $LATEST_IMAGE >/dev/null 2>&1 && sudo docker tag $LATEST_IMAGE $BACKUP_IMAGE || true

            echo "🐳 Build new frontend image with Vite env injection"
            sudo docker build --no-cache \
              --build-arg VITE_API_BASE_URL=$API_URL \
              -t $NEW_IMAGE \
              -f $LOCAL_DOCKERFILE .

            sudo docker tag $NEW_IMAGE $LATEST_IMAGE

            echo "🛑 Stop old container"
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true

            echo "🚀 Start new container"
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p $PORT_MAPPING \
              $LATEST_IMAGE

            echo "⏳ Waiting for startup..."
            sleep 6

            echo "🔍 Health check"
            if curl -f http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "✅ Frontend deployed successfully!"
            else
              echo "❌ Deployment failed → Rolling back"

              sudo docker stop $CONTAINER_NAME || true
              sudo docker rm $CONTAINER_NAME || true

              if sudo docker image inspect $BACKUP_IMAGE >/dev/null 2>&1; then
                sudo docker tag $BACKUP_IMAGE $LATEST_IMAGE
                sudo docker run -d \
                  --name $CONTAINER_NAME \
                  --restart always \
                  -p $PORT_MAPPING \
                  $LATEST_IMAGE
                echo "✅ Rollback successful"
              else
                echo "⚠️ No backup image available"
                exit 1
              fi
            fi

            echo "🧹 Cleanup unused images"
            sudo docker image prune -af

            echo "=============================="
            echo "✅ FRONTEND DEPLOYMENT FINISHED"
            echo "=============================="
