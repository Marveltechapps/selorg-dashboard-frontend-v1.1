name: Deploy Selorg Frontend (Rollback Safe)

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Deploy Frontend via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ubuntu
      key: ${{ secrets.EC2_SSH_KEY }}
      port: ${{ secrets.EC2_PORT }}
      script: |
        set -e

        FRONTEND_DIR="/home/ubuntu/selorg/selorg-dashboard-frontend-v1.1"
        DOCKERFILE="/home/ubuntu/dockerfiles/Dockerfile.frontend"
        ENV_FILE="/home/ubuntu/envs/selorg-dashboard.env"

        IMAGE="selorg-dashboard-frontend"
        CONTAINER="selorg-frontend"
        PORT="8080:80"

        cd $FRONTEND_DIR
        git reset --hard
        git clean -fd
        git pull origin main

        API_URL=$(grep VITE_API_BASE_URL $ENV_FILE | cut -d '=' -f2)
        echo "Using API URL: $API_URL"

        COMMIT=$(git rev-parse --short HEAD)
        NEW="$IMAGE:$COMMIT"
        LATEST="$IMAGE:latest"
        BACKUP="$IMAGE:backup"

        sudo docker image inspect $LATEST >/dev/null 2>&1 && sudo docker tag $LATEST $BACKUP || true

        sudo docker build --no-cache --build-arg VITE_API_BASE_URL=$API_URL -t $NEW -f $DOCKERFILE .

        sudo docker tag $NEW $LATEST

        sudo docker stop $CONTAINER || true
        sudo docker rm $CONTAINER || true

        sudo docker run -d \
          --name $CONTAINER \
          --restart always \
          -p $PORT \
          $LATEST

        sleep 5

        if curl -f http://127.0.0.1:8080 >/dev/null 2>&1; then
          echo "Frontend OK"
        else
          echo "Rollback frontend"
          sudo docker stop $CONTAINER || true
          sudo docker rm $CONTAINER || true
          sudo docker tag $BACKUP $LATEST
          sudo docker run -d \
            --name $CONTAINER \
            --restart always \
            -p $PORT \
            $LATEST
          exit 1
        fi

        sudo docker image prune -af
```
